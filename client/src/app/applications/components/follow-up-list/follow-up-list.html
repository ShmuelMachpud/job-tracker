<section
  class="follow-ups"
  [class.surface-card]="items().length === 0"
  [class.has-items]="items().length > 0"
  aria-labelledby="follow-ups-title"
>
  <h2 id="follow-ups-title" class="title">
    <mat-icon aria-hidden="true">notifications</mat-icon>
    צריך לעקוב
    @if (items().length > 0) {
      <span>· {{ items().length }}</span>
    }
  </h2>

  @for (item of items(); track key(item)) {
    <button type="button" class="item" (click)="select(item)">
      <span class="name">
        @if (item.kind === 'recruiter') {
          <mat-icon class="kind" aria-label="מגייס">person</mat-icon>
        }
        <span class="company">{{ title(item) }}</span>
      </span>
      <span class="reason">{{ describe(item) }}</span>
    </button>
  } @empty {
    <p class="empty">הכול מעודכן. אין משרות או מגייסים שמחכים לך.</p>
  }
</section>
