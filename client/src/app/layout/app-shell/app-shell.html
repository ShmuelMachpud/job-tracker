<div class="frame">
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"></span>
      <span class="brand-name" dir="ltr">
        <span class="job">Job</span><span class="tracker">Tracker</span>
      </span>
    </div>

    <nav class="tabs" aria-label="ניווט ראשי">
      <a routerLink="/" [class.active]="onJobs()" [attr.aria-current]="onJobs() ? 'page' : null"
        >משרות</a
      >
      <a routerLink="/recruiters" routerLinkActive="active">מגייסים</a>
    </nav>

    <div class="actions">
      <ng-content select="[shellActions]" />
      <app-user-menu />
    </div>
  </header>

  <main class="content">
    <ng-content />
  </main>
</div>
